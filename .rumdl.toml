[global]
enable = ["MD013"]
exclude = [".agents", ".claude"]

[MD013]
line-length = 80
tables = false
code-blocks = false
reflow = true

# A prompt template's line breaks are the prompt's: a part filled in mid-line
# would break its sentence where the template wrapped. A forked skill keeps
# its upstream's line breaks, so a diff against the upstream shows only what
# the fork changed.
[per-file-ignores]
"briefs/prompts/**" = ["MD013"]
"briefs/plugin/skills/**" = ["MD013"]
